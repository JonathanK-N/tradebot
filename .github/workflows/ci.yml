name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Recherche de secrets committés par erreur
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check src tests
      - name: Config valide (plafonds de risque codés en dur)
        run: uv run tradebot config-check > /dev/null
      - name: Tests (risque, anti look-ahead, simulateur, MT5 simulé, pont, API)
        run: uv run pytest -q
